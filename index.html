<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Frontend - Iframe Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        iframe {
            width: 90%;
            height: 90%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <script>
        // Dynamically set iframe src with parent origin as query param
        const iframe = document.createElement('iframe');
        const parentOrigin = encodeURIComponent(window.location.origin);
        iframe.src = `https://org2.cus.qa.ctnxt.clootrack.com/analysis/176b2047-4b13-4ac4-8d57-0d8f098a622d/dashboard?parentOrigin=${parentOrigin}&tab=0&nav=collapsed`;
        document.body.appendChild(iframe);
    </script>
</body>
</html>
